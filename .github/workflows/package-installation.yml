name: WordPress package installation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wpackagist:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: stable
            composer: '2.10.3'
            library: '2.10.3'
          - name: next
            composer: snapshot
            library: 'dev-main#25612018356ea810bce1b86fba84acd4634b5a96 as 2.10.99'
    env:
      COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH_JSON }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5.9'
          extensions: curl, dom, mbstring, mysqli
          tools: composer:${{ matrix.composer }}
          coverage: none
      - name: Compare normal and offline placement with real repository packages
        run: python3 tools/wpackagist-smoke.py --php php --composer "$(command -v composer)" --composer-library '${{ matrix.library }}'
      - name: Install and exercise the documented examples
        run: python3 tools/smoke-examples.py --php php --composer "$(command -v composer)"
      - name: Install the matching Composer library for recovery contract tests
        run: |
          composer require 'composer/composer:${{ matrix.library }}' --no-update --no-plugins --no-scripts --no-interaction
          composer update --no-interaction --no-progress --no-plugins --no-scripts
      - name: Repeat recovery tests with warning diagnostics
        run: |
          for seed in 1 2 3 4 5; do
            php vendor/bin/phpunit --no-logging --display-all-issues --fail-on-warning --fail-on-phpunit-deprecation --order-by=random --random-order-seed="$seed" --filter 'PackageLayoutTest|PackageDestinationTest'
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: wpackagist-installation-${{ matrix.name }}
          path: build/consumer-smoke/wpackagist-report.json
          if-no-files-found: error
