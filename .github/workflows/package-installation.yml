name: WordPress package installation

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  wpackagist:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: stable
            composer: '2.10.3'
          - name: latest
            composer: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5.9'
          extensions: curl, dom, mbstring, mysqli
          tools: composer:${{ matrix.composer }}
          coverage: none
      - name: Pin the library to the actual selected stable Composer CLI
        id: versions
        run: |
          composer --version --no-ansi | python3 -c 'import os,re,sys; match=re.search(r"Composer version (2\.\d+\.\d+)\b",sys.stdin.read()); assert match, "Expected a stable Composer 2 CLI"; open(os.environ["GITHUB_OUTPUT"],"a").write("library="+match.group(1)+"\n")'
      - name: Compare normal and offline placement with real repository packages
        run: python3 tools/wpackagist-smoke.py --php php --composer "$(command -v composer)" --composer-library '${{ steps.versions.outputs.library }}'
      - name: Install and exercise the documented examples
        run: python3 tools/smoke-examples.py --php php --composer "$(command -v composer)"
      - name: Install the matching Composer library for recovery contract tests
        run: |
          composer require 'composer/composer:${{ steps.versions.outputs.library }}' --no-update --no-plugins --no-scripts --no-interaction
          composer update --no-interaction --no-progress --no-plugins --no-scripts
      - name: Repeat recovery tests with warning diagnostics
        run: |
          for seed in 1 2 3 4 5; do
            php vendor/bin/phpunit --no-logging --display-all-issues --fail-on-warning --fail-on-phpunit-deprecation --order-by=random --random-order-seed="$seed" --filter 'PackageLayoutTest|PackageDestinationTest'
          done
      - name: Verify shared-group access using distinct PHP identities
        run: sudo "$(command -v php)" vendor/bin/phpunit --no-logging --fail-on-skipped tools/tests/SharedGroupTest.php
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: wpackagist-installation-${{ matrix.name }}
          path: build/consumer-smoke/wpackagist-report.json
          if-no-files-found: error
