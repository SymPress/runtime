name: WordPress package installation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wpackagist:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5.9'
          extensions: curl, dom, mbstring, mysqli
          tools: composer:2.10.3
          coverage: none
      - name: Compare normal and offline placement with real repository packages
        run: python3 tools/wpackagist-smoke.py --php php --composer "$(command -v composer)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wpackagist-installation
          path: build/consumer-smoke/wpackagist-report.json
          if-no-files-found: error
