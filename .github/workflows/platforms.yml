name: Platforms and stable dependencies

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  platforms:
    name: ${{ matrix.os }} / Composer ${{ matrix.composer }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        composer: ['2.10.3', '2']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: curl, dom, mbstring, mysqli
          tools: composer:${{ matrix.composer }}
          coverage: none
      - name: Resolve stable packages with the selected Composer library
        env:
          COMPOSER_LINE: ${{ matrix.composer }}
        run: |
          if [[ "$COMPOSER_LINE" == '2.10.3' ]]; then
            composer update --with composer/composer:2.10.3 --no-plugins --no-scripts --no-interaction --no-progress --prefer-dist
          else
            composer update --no-plugins --no-scripts --no-interaction --no-progress --prefer-dist
          fi
          composer validate --strict
          composer check-platform-reqs
          # shellcheck disable=SC2016 # PHP variables must not be expanded by Bash.
          php -r 'require "vendor/autoload.php"; $lock = json_decode(file_get_contents("composer.lock"), true, flags: JSON_THROW_ON_ERROR); foreach (array_merge($lock["packages"], $lock["packages-dev"] ?? []) as $package) { if (Composer\Semver\VersionParser::parseStability($package["version"]) !== "stable" || ($package["dist"]["type"] ?? "") === "path") { throw new RuntimeException("Unstable or local dependency: " . $package["name"]); } }'
      - name: Use an explicitly case-insensitive APFS fixture volume on macOS
        if: runner.os == 'macOS'
        run: |
          hdiutil create -size 256m -fs APFS -volname RuntimeCaseInsensitive "$RUNNER_TEMP/runtime-case.dmg"
          hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/runtime-case" "$RUNNER_TEMP/runtime-case.dmg"
          mkdir -p "$RUNNER_TEMP/runtime-case/tmp"
          echo "TMPDIR=$RUNNER_TEMP/runtime-case/tmp" >> "$GITHUB_ENV"
          touch "$RUNNER_TEMP/runtime-case/tmp/CaseProbe"
          test -f "$RUNNER_TEMP/runtime-case/tmp/caseprobe"
          rm "$RUNNER_TEMP/runtime-case/tmp/CaseProbe"
      - name: Exercise portable filesystem and actual Composer relocation contracts
        run: php vendor/bin/phpunit --no-logging --fail-on-skipped --fail-on-warning tests/Platform tests/Unit/PackageDestinationTest.php
      - name: Detach the macOS fixture volume
        if: ${{ always() && runner.os == 'macOS' }}
        run: |
          # GITHUB_ENV only changes subsequent steps; hdiutil must also use the host temp directory now.
          export TMPDIR="$RUNNER_TEMP"
          echo "TMPDIR=$TMPDIR" >> "$GITHUB_ENV"
          if [[ -d "$RUNNER_TEMP/runtime-case" ]]; then
            # Allow transient handles on this disposable fixture volume to close.
            for delay in 2 5; do
              if hdiutil detach "$RUNNER_TEMP/runtime-case"; then
                exit 0
              fi
              sleep "$delay"
            done
            # Preserve a real cleanup failure after the bounded retries.
            hdiutil detach "$RUNNER_TEMP/runtime-case"
          fi
      - name: Record exact toolchain and dependency versions
        if: always()
        run: |
          mkdir -p build/platform-evidence
          php --version > build/platform-evidence/php.txt
          composer --version > build/platform-evidence/composer.txt
          composer show --format=json > build/platform-evidence/packages.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: platform-${{ matrix.os }}-composer-${{ matrix.composer }}
          path: build/platform-evidence
          if-no-files-found: error

  lowest:
    name: Lowest stable Symfony 8.1 dependency set
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: curl, dom, mbstring, mysqli
          tools: composer:2.10.3
          coverage: none
      - name: Resolve current stable development tools and lowest production dependencies
        run: |
          composer update --no-interaction --no-progress --prefer-dist
          # Keep QA tool versions current; lower the production boundary and its dependencies.
          # shellcheck disable=SC2016 # PHP variables must not be expanded by Bash.
          mapfile -t packages < <(php -r '$manifest = json_decode(file_get_contents("composer.json"), true, flags: JSON_THROW_ON_ERROR); foreach (array_keys($manifest["require"]) as $name) { if (str_contains($name, "/")) { echo $name, PHP_EOL; } }')
          composer update "${packages[@]}" --prefer-lowest --prefer-stable --with-dependencies --no-interaction --no-progress --prefer-dist
      - name: Validate and run strict QA on the lower dependency boundary
        run: |
          composer validate --strict
          composer check-platform-reqs
          # shellcheck disable=SC2016 # PHP variables must not be expanded by Bash.
          php -r '$manifest = json_decode(file_get_contents("composer.json"), true, flags: JSON_THROW_ON_ERROR); $lock = json_decode(file_get_contents("composer.lock"), true, flags: JSON_THROW_ON_ERROR); $versions = array_column($lock["packages"], "version", "name"); foreach ($manifest["require"] as $name => $constraint) { if (str_starts_with($name, "symfony/") && !str_starts_with(ltrim($versions[$name], "v"), "8.1.")) { throw new RuntimeException("Lowest Symfony 8.1 boundary was not resolved: " . $name); } }'
          composer qa
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lowest-stable-lock
          path: composer.lock
          if-no-files-found: error
